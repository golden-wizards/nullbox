# Tests and lints on every PR. On main, deploy.yml calls this workflow before it deploys,
# so each push to main runs it exactly once.
# Job names (`rust`, `web`) are the required status checks for main; rename with care.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its older run. On main (called from deploy) every run finishes;
  # `github.workflow` is the caller's name there, so this never queues behind deploy itself.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Compile queries against the committed .sqlx cache instead of a live database.
      SQLX_OFFLINE: "true"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Only main writes the cache, so PRs can't fill it with their branches' builds.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked

      - name: Generated TS types are up to date
        # `cargo test` regenerates the ts-rs bindings; a diff means they weren't committed.
        run: git diff --exit-code -- apps/web/src/api/generated

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
