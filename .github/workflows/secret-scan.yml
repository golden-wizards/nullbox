# Server-side secret scan (#3). Local hooks can be skipped, this can't.
# Uses the gitleaks CLI (the gitleaks action needs a paid license for org repos)
# with the repo rules in .gitleaks.toml.
#
# Two jobs:
# - `secret-scan` (required check): only new commits, i.e. the PR's commits or the
#   pushed range on main. Blocks a new leak from landing.
# - `secret-scan-history` (#48): every commit, on push to main, daily, and on PRs that
#   touch the scan itself. Findings listed in .github/secret-scan-known.txt (the old
#   ADMIN_TOKEN leak, waiting for the history purge #10) are reported as warnings so
#   they stay visible; anything else fails the job.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secret-scan:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Pick commit range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="$PUSH_AFTER~1..$PUSH_AFTER"
          fi
          echo "Scanning $range"
          echo "RANGE=$range" >> "$GITHUB_ENV"

      - name: Run gitleaks
        run: gitleaks git --log-opts="$RANGE" --config .gitleaks.toml --redact --no-banner -v

  secret-scan-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip PRs that don't touch the scan
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ] && ! git diff --name-only "$PR_BASE...$PR_HEAD" |
            grep -qE '^(\.github/workflows/secret-scan\.yml|\.github/secret-scan-known\.txt|\.gitleaks\.toml|scripts/secret-scan-history)'; then
            run=false
            echo "PR doesn't change the secret scan; the full-history scan runs on main."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Install gitleaks
        if: steps.gate.outputs.run == 'true'
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test the scan script
        if: steps.gate.outputs.run == 'true'
        run: scripts/secret-scan-history.test.sh

      - name: Scan full history
        if: steps.gate.outputs.run == 'true'
        run: scripts/secret-scan-history.sh
