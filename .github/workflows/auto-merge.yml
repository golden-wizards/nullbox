# Turn on auto-merge (squash) for every PR, so it merges by itself once the
# required review and required checks (see the main ruleset) pass. GitHub has
# no repo setting that does this by default.
#
# Also runs on `synchronize`: GitHub sends no pull_request events while a PR has
# merge conflicts, so a PR opened conflicted only gets auto-merge on its next push.
#
# Opt out: add the `no-automerge` label. Clicking "Disable auto-merge" only lasts
# until the next push, which turns it back on.
#
# Token: merges finished by GITHUB_TOKEN do not trigger other workflows, so a
# `push: main` deploy would not run after an auto-merge. Set the repo secret
# AUTOMERGE_TOKEN (fine-grained PAT or GitHub App token with contents +
# pull-requests write on this repo) to avoid that. Without it, GITHUB_TOKEN is used.
name: auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions: {}

jobs:
  enable:
    # Skip PRs that already have auto-merge, drafts, PRs opted out by label, and
    # fork PRs (their token is read-only).
    if: >-
      github.event.pull_request.auto_merge == null &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'no-automerge') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
